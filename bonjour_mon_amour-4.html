<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonjour mon amour ♥️</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:Georgia,serif; color:#5b3a45;
    background:linear-gradient(180deg,#fff1f5 0%,#ffe1e9 55%,#ffd2df 100%);
  }
  .scene{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center}
  .sun{position:absolute;width:125px;height:125px;border-radius:50%;
       background:#ffd76a;box-shadow:0 0 35px #ffd76a,0 0 75px #ffd76a88,0 0 120px #ffd76a55;
       top:8vh;left:50%;transform:translateX(-50%);
       animation:sunrise 2.5s ease-out both, glow 2s ease-in-out infinite 2.5s}
  .card{
    position:relative;z-index:2;width:min(88%,520px);padding:42px 28px;
    text-align:center;border-radius:30px;background:#ffffffc9;
    backdrop-filter:blur(8px);box-shadow:0 18px 50px #8d536c30;
    animation:appear 1.4s ease-out both .4s;
  }
  h1{margin:0 0 16px;font-size:clamp(30px,8vw,46px);font-weight:500}
  p{margin:10px 0;font-size:clamp(18px,4.5vw,22px);line-height:1.55}
  .heart{font-size:42px;display:inline-block;animation:beat 1.3s infinite}
  .small{margin-top:22px;font-size:16px;opacity:.75}
  .heart-float{position:absolute;bottom:-40px;font-size:24px;animation:float 7s linear infinite;opacity:0}
  .h1{left:8%;animation-delay:.5s}.h2{left:18%;animation-delay:2.2s}.h3{left:30%;animation-delay:4s}
  .h4{left:42%;animation-delay:1.5s}.h5{left:55%;animation-delay:3.2s}.h6{left:68%;animation-delay:.9s}
  .h7{left:80%;animation-delay:2.7s}.h8{left:90%;animation-delay:4.8s}.h9{left:50%;animation-delay:6s}
  .h10{left:25%;animation-delay:5.2s}
  @keyframes sunrise{from{top:30vh;opacity:0}to{top:8vh;opacity:1}}
  @keyframes glow{0%,100%{transform:translateX(-50%) scale(1);filter:brightness(1)}
                     50%{transform:translateX(-50%) scale(1.08);filter:brightness(1.18)}}
  @keyframes appear{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  @keyframes float{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="scene">
  <div class="sun"></div>
  <div class="heart-float h1">♥</div>
  <div class="heart-float h2">♡</div>
  <div class="heart-float h3">♥</div>
  <div class="heart-float h4">♥</div>
  <div class="heart-float h5">♡</div>
  <div class="heart-float h6">♥</div>
  <div class="heart-float h7">♥</div>
  <div class="heart-float h8">♡</div>
  <div class="heart-float h9">♥</div>
  <div class="heart-float h10">♥</div>
  <main class="card">
    <div class="heart">♥️</div>
    <h1>Bonjour mon amour</h1>
    <p>J’espère que tu as bien dormi.</p>
    <p>Je te souhaite une très belle journée, remplie de jolies choses. ✨</p>
    <p>Réveille-toi doucement…<br>je pense fort à toi. 🥰</p>
    <div class="small">Passe une merveilleuse journée, mon cœur ♥️</div>
  </main>
</div>
</body>
</html>
